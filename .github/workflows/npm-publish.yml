name: Publish

on:
  push:
    tags: ['v1.*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: yarn

      - name: Check that package.json and CHANGELOG.md are ready for this tag
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "v$package_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json has version $package_version, but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
          sh scripts/changelog-section.sh "$package_version" > /dev/null

      - run: yarn install --frozen-lockfile

      - run: yarn test:coverage

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - run: yarn install --frozen-lockfile --ignore-scripts

      - run: yarn build

      - name: Point npm at the registry for trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish under the latest-1 dist-tag unless this version is already on npm
        run: |
          if npm view "guardian-of-env@${GITHUB_REF_NAME#v}" version > /dev/null 2>&1; then
            echo "guardian-of-env@${GITHUB_REF_NAME#v} is already on npm"
          else
            npm publish --tag latest-1
          fi

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Take the release notes from CHANGELOG.md
        run: sh scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Create the GitHub release unless it exists
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The $GITHUB_REF_NAME release already exists"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag --latest=false
          fi
        env:
          GH_TOKEN: ${{ github.token }}
